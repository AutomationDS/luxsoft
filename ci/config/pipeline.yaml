# ==========================================================
# Pipeline Configuration
# ==========================================================

pipeline:
  name: luxsoft-dev
  owner: DevOps Team

# ==========================================================
# Application Configuration
# ==========================================================

application:
  name: luxsoft
  type: fullstack

  backend:
    language: python
    runtime: python
    runtime_version: "3.12"
    source: app/backend
    dependency_file: requirements.txt

  frontend:
    language: typescript
    runtime: node
    package_manager: pnpm
    source: app/frontend

  release:
    version: "1.0.0"

# ==========================================================
# Workspace
# ==========================================================

workspace:
  clean_before_build: true
  clean_after_build: true

# ==========================================================
# Build
# ==========================================================

build:
  backend: true
  frontend: true

# ==========================================================
# Testing
# ==========================================================

testing:
  enabled: true
  backend:
    framework: pytest
    coverage: true
  frontend:
    enabled: false

# ==========================================================
# SonarQube
# ==========================================================

sonarqube:
  enabled: true
  quality_gate: true

# ==========================================================
# Container
# ==========================================================

container:
  enabled: true
  registry: ghcr.io
  repository: automationds
  image_name: luxsoft
  tag_strategy: build_number

# ==========================================================
# Security
# ==========================================================

security:
  trivy:
    enabled: true
    fail_on:
      critical: true
      high: false

# ==========================================================
# Deployment
# ==========================================================

deployment:
  environment: preprod
  strategy: rolling

# ==========================================================
# Notifications
# ==========================================================

notification:
  teams: true
  email: false
